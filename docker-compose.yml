# Only stateful services run in Docker. Embedding/reranking models run natively on the host
# because Docker on macOS has no GPU/MPS access.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships without curl/wget; bash's /dev/tcp is enough to probe the readiness endpoint.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix:version-22.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"   # UI + OTLP/HTTP (/v1/traces)
      - "127.0.0.1:${PHOENIX_GRPC_PORT:-4317}:4317"  # OTLP/gRPC
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      # Phoenix >= 22 requires auth whenever it binds to a non-loopback address, which a container must do.
      # The port is published on 127.0.0.1 only (see ports), so local dev runs without auth by default.
      # To enable auth: PHOENIX_ENABLE_AUTH=true in .env, PHOENIX_SECRET in a docker-compose.override.yml
      # (Phoenix rejects an empty secret, so it can't default here), and PHOENIX__API_KEY for the app.
      PHOENIX_ENABLE_AUTH: "${PHOENIX_ENABLE_AUTH:-false}"
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  qdrant_data:
  phoenix_data:
