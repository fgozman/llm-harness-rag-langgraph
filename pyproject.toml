[project]
name = "rag"
version = "0.1.0"
description = "Grounded, cited RAG over a local document folder (LangGraph + Qdrant + Phoenix)."
authors = [
    { name = "leo", email = "fgozman@yahoo.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "arize-phoenix-otel>=0.17.3",
    "httpx>=0.28.1",
    "langchain-core>=1.8.4",
    "langgraph>=1.2.24",
    "openinference-instrumentation-langchain>=0.1.90",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "qdrant-client>=1.20.0",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "TID", "PL"]
ignore = ["PLR2004"]  # magic-value comparisons are normal in tests and thresholds

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs Qdrant, Phoenix, ML models, or an LLM API (run with `-m integration`)",
]
