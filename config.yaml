# Non-secret defaults. Environment variables and .env override these values.
# Model fields left unset are filled from the hardware profile (see rag.config.PROFILE_DEFAULTS).

hardware_profile: mac
device: auto
docs_dir: ./data/docs
state_dir: ./.rag

llm:
  # Any LangChain chat-model provider (init_chat_model): anthropic | openai | ollama have presets (models and
  # options below); others (google_genai, mistralai, bedrock_converse, ...) need the three models set.
  # Install the provider's integration: `uv sync --extra anthropic` (or openai / ollama), or
  # `uv add langchain-<provider>`. API keys come from its standard env var (ANTHROPIC_API_KEY, ...).
  provider: anthropic
  # Models default per provider preset (anthropic: claude-sonnet-5-5 / claude-opus-5-5 / claude-haiku-5-5,
  # openai: gpt-6.2-sol / gpt-6.2-astra / gpt-6-luna, ollama: qwen3:8b / qwen3:32b / qwen3:8b).
  # generation_model: claude-sonnet-5-5
  # upgrade_model: claude-opus-5-5
  # cheap_model: claude-haiku-5-5
  # base_url: http://localhost:11434   # endpoint override (Ollama host, OpenAI-compatible gateway, ...)
  # Chat-model options for every call, in the integration's own names; merged over the preset's
  # (timeouts/retries, OpenAI store: false, ...), so only the keys set here change:
  # params: {timeout: 300}
  # Per-task model role, output budget and options (defaults in rag.config._default_tasks and the provider
  # preset); entries merge with the defaults, e.g.:
  # tasks:
  #   generate: {model: upgrade, max_tokens: 8192}
  #   analyze: {params: {effort: low, thinking: {type: disabled}}}

embedding:
  # model and batch_size default from the hardware profile; set them here to override.
  max_length: 8192
  query_instruction: Given a question about a document collection, retrieve relevant passages that answer the question

reranker:
  enabled: true
  # model and candidates default from the hardware profile.
  fallback_model: BAAI/bge-reranker-v2-m3
  top_k: 6
  batch_size: 8

retrieval:
  mode: hybrid                 # hybrid | dense | sparse
  candidates_per_ranking: 50
  rrf_k: 60
  context_token_budget: 12000

qdrant:
  url: http://localhost:6333
  collection: rag_chunks
  sparse_model: Qdrant/bm25

phoenix:
  enabled: true
  collector_endpoint: http://localhost:6006
  project_name: rag

chunking:
  child_target_tokens: 500
  child_max_tokens: 600
  overlap_ratio: 0.12
  parent_max_tokens: 2000

ingestion:
  contextualize: true
  contextualize_concurrency: 4
  # Chat-model options for contextualization (default: the provider preset's, thinking off), e.g.:
  # contextualize_params: {effort: low, thinking: {type: disabled}}
  contextualize_max_prompt_tokens: 8000    # local-tokenizer count; must stay < 100K (Haiku price tier)
  window_files: 50
  pdf_ocr: true
  language: en
  # Read all-numeric dates (05/06/2026) when dating documents: dmy | mdy. Unset = ambiguous, skipped.
  # Applies to files (re)indexed afterwards: run `rag ingest --force` to re-date files already indexed.
  # numeric_date_order: dmy

graph:
  max_rewrite_retries: 2
  max_regenerations: 1
  min_relevant_passages: 2
  max_query_variants: 4
  history_turns: 6
  turn_timeout_s: 180          # end-to-end deadline per question (CLI + API)

api:
  host: 127.0.0.1              # no auth: keep it on loopback
  port: 8000
  max_concurrent_turns: 4
  ingest_roots: []             # folders /ingest may index besides docs_dir

log:
  level: INFO
  format: text                 # text | json (one JSON object per line)

# Test corpus sources: scripts/corpus_sources.yaml (SEC contact email: CORPUS__SEC_USER_AGENT_EMAIL in .env).
